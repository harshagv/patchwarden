{% extends "base.html" %}
{% block title %}Log in to Patchwarden{% endblock %}
{% block content %}
<div class="card">
  <h1>Log in to Patchwarden</h1>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/dashboard/login" class="grid">
    <input type="hidden" name="next" value="{{ next or '/dashboard/sites' }}">
    <label>Email<br><input name="email" type="email" autocomplete="username" value="{{ email or '' }}" required></label>
    <label>Password<br><input name="password" type="password" autocomplete="current-password" required></label>
    {% if need_code %}<label>Code from your authenticator app (or a recovery code)<br>
      <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="20" required autofocus></label>{% endif %}
    <p><button type="submit">Log in</button></p>
  </form>
  <p class="muted">No account yet? <a href="/dashboard/signup?next={{ (next or '/dashboard/sites') | urlencode }}">Create one, free</a>.</p>
</div>
{% endblock %}
